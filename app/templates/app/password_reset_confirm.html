{% load static %}

<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/svg" href="{% static 'images/logo.svg' %}" />
        <title>ClickShop Online Shopping Dz</title>
        <meta charset="utf-8" />

        <link rel="stylesheet" type="text/css" href="{% static 'css/reset_password_style.css' %}" />

    </head>

    <body>

        <header>
            <div>
                <a href="{% url 'home' %}"><img src="{% static 'images/logo.svg' %}" alt="logo ClickShop" /></a>
            </div>
        </header>

        <section>

            <h1>Enter new password</h1>
                      
                      
            <p>Please enter your new password twice so we can verify you typed it in correctly</p>

            <form method="post">
                {% csrf_token %}
                {{form}}
                <hr />
                <input type="submit" value="Update Password"> 
            </form>

        </section>

    </body>
</html>

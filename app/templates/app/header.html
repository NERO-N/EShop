{% load static %}

<header>
	<div>
		<a href="{% url 'home' %}"><img src="{% static 'images/logo.svg' %}" alt="Logo ClickShop" /></a>
	</div>
	<ul>
		<li>
			<form method="GET" action="{% url 'collection' 'product' %}#filter_header">
				{% csrf_token %}
				<input type="search"   name="product_name" id="search" placeholder="Search" maxlength="30" required />
				<input type="submit" value=""  />					
			</form>
		</li>
		<li>
			<a href="{% url 'bag' %}"><div class="bag"></div></a>
			
			{% if order.total_items > 0 %}
			<p>{{order.total_items}}</p>
			{% endif %}

		</li>
		<li>
			{% if request.user.is_authenticated %}
			<a href="{% url 'logout' %}"><div class="logout"></div></a>
			{% else%}
			<a href="{% url 'login' %}"><div class="login"></div></a>
			{% endif %}
		</li>

	</ul>
</header>
